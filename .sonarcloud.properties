# SonarQube Cloud automatic analysis scope.
#
# The skale-club organization is on the free plan: 50,000 lines of code across
# all its private projects. xpot has about 68,000, so only the server and the
# shared code are analysed (about 24,000 lines): the business rules, the API
# and its authorization. The React client and the NFC provisioner stay out;
# CI still type-checks, tests and builds them on every pull request.

sonar.sources=server,shared
sonar.exclusions=**/*.test.ts
sonar.sourceEncoding=UTF-8
