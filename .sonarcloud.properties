# SonarQube Cloud automatic analysis scope.
#
# The skale-club organization is on the free plan: 50,000 lines of code across
# all its private projects. Once the server and the shared code passed about
# 36,000 lines, every analysis failed, so the scope is now the part where a bug
# costs the most: everything the server exposes over HTTP and how it checks who
# may call it (about 21,000 lines).
#
# Left out, and still type-checked, tested and built by CI on every pull request:
# - the React client and the NFC provisioner;
# - shared/, mostly table definitions and types the server and client share;
# - the internal services behind the tag and customer order routes. Their route
#   files, access checks and public pages stay in.
# When the server grows past about 24,000 lines again, trim here before the
# analysis starts failing.

sonar.sources=server
sonar.exclusions=**/*.test.ts,\
  server/customerOrders/service.ts,\
  server/tags/acquisitions.ts,\
  server/tags/custody.ts,\
  server/tags/distribution.ts,\
  server/tags/field.ts,\
  server/tags/journey.ts,\
  server/tags/metrics.ts,\
  server/tags/pieceActivity.ts,\
  server/tags/production.ts,\
  server/tags/provisioning.ts,\
  server/tags/qrAssets.ts,\
  server/tags/queues.ts,\
  server/tags/report.ts,\
  server/tags/repository.ts,\
  server/tags/reviewLink.ts,\
  server/tags/sales.ts
sonar.sourceEncoding=UTF-8
