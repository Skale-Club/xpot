# SonarQube Cloud automatic analysis scope: the application code, with tests
# marked as tests, and none of the landing images, build output or SQL.

sonar.sources=client/src,server,shared,scripts,nfc-provisioner/src
sonar.tests=tests,nfc-provisioner/test
sonar.exclusions=**/*.webp,**/*.png,**/*.svg,**/*.ico,dist/**,client/public/**,migrations/**
sonar.sourceEncoding=UTF-8
