name: CI

on:
  # Every PR, including stacked ones whose base is another feature branch.
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Disposable Postgres for the tags integration test (tests/tags/tags.integration.test.ts).
    services:
      postgres:
        image: postgres:17
        # Throwaway database reachable only from this job: no password at all.
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: xpot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # The print pipeline (docs/PRINT_EXECUTION_PLAN.md): every Python file compiles, and the parts that need no
      # geometry packages, fonts or slicer (bed recipe, builder registry, catalog) pass their tests.
      - name: Print pipeline
        run: |
          python3 -m compileall -q print-pipeline
          python3 -m unittest discover -s print-pipeline/tests -p "test_*.py"

      - name: Unit tests
        run: npm test

      # The desktop NFC writer's logic (job flow, pairing, protocol) needs none of its Electron or PC/SC packages:
      # the root's tsx runs it, so a protocol drift or a broken flow fails here instead of on the bench.
      - name: NFC provisioner tests
        run: npx tsx --test nfc-provisioner/test/*.test.ts

      - name: Integration tests (real Postgres)
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/xpot_ci?sslmode=disable
          TAGS_INTEGRATION: "1"
        run: |
          npm run migrate
          npx vitest run --no-file-parallelism tests/tags/tags.integration.test.ts tests/tags/journey.integration.test.ts tests/mcp.integration.test.ts tests/resellerAccounts.integration.test.ts tests/phoneAuth.integration.test.ts tests/wholesale.integration.test.ts tests/mcp.oauth.integration.test.ts \
            tests/tags/stockMetrics.integration.test.ts tests/tags/distribution.integration.test.ts tests/tags/pieceScreen.integration.test.ts \
            tests/tags/resellerCustomers.integration.test.ts tests/tags/organizationKits.integration.test.ts tests/leadPieceAccess.integration.test.ts \
            tests/tags/organizationFilter.integration.test.ts

      - name: Build
        run: npm run build
