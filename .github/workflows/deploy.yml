name: Deploy to Coolify

# ─────────────────────────────────────────────────────────────────────────────
# Deploys only after the CI workflow succeeded on main (type check, tests,
# build). Coolify does the Docker build + run; this workflow triggers it, waits
# for the deployment to finish and then probes the public health endpoint, so a
# failed rollout turns the job red. Same flow as skaleclub's deploy.yml.
#
# Prerequisites (GitHub → Settings → Secrets and variables → Actions):
#   1. Secret   COOLIFY_TOKEN     = the Coolify API token.
#   2. Variable COOLIFY_APP_UUID  = the Xpot app's Coolify resource uuid.
#   3. Variable XPOT_PUBLIC_URL   = public origin, e.g. https://xpot.place
# Until both variables exist the job only prints a notice, so pushes to main do
# not go red before the Coolify app is created.
#
# GOTCHAS:
#   - COOLIFY_BASE MUST be the HTTPS domain, NOT http://<ip>:8000 (the Hetzner
#     firewall closes 8000 to the public; GitHub runners only reach 443).
#   - Do NOT also turn on Coolify's UI "Automatic Deployment", or each push
#     deploys twice.
#   - workflow_dispatch deploys without waiting for CI: use it for emergencies.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: coolify-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COOLIFY_BASE: https://coolify.skale.club
      APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      PUBLIC_URL: ${{ vars.XPOT_PUBLIC_URL }}
      OPS_TELEGRAM_ENABLED: ${{ vars.OPS_TELEGRAM_ENABLED }}
      OPS_ENVIRONMENT: production
      XPOT_TELEGRAM_BOT_TOKEN: ${{ secrets.XPOT_TELEGRAM_BOT_TOKEN }}
      XPOT_TELEGRAM_CHAT_ID: ${{ secrets.XPOT_TELEGRAM_CHAT_ID }}
      OPS_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      OPS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Skip if not configured, or if main moved past the CI-validated commit
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "${APP_UUID}" ] || [ -z "${PUBLIC_URL}" ]; then
            echo "::notice::Coolify deploy not configured yet (set repo variables COOLIFY_APP_UUID and XPOT_PUBLIC_URL). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main_sha=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" refs/heads/main | cut -f1)
          if [ -z "${main_sha}" ]; then
            echo "::error::Could not read refs/heads/main"; exit 1
          fi
          if [ -n "${CI_SHA}" ] && [ "${CI_SHA}" != "${main_sha}" ]; then
            echo "::notice::Skipping deploy: CI validated ${CI_SHA} but main is now ${main_sha}. The newer push has its own CI run and deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "sha=${main_sha}" >> "$GITHUB_OUTPUT"

      - name: Notify deployment started
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        env:
          OPS_EVENT: build-started
        run: python3 scripts/ops/telegram-ops.py notify

      - name: Trigger Coolify deployment
        id: trigger
        if: steps.guard.outputs.skip == 'false'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::error::COOLIFY_TOKEN secret is not set"; exit 1
          fi
          echo "Triggering deploy for app ${APP_UUID}"
          # -X POST is required: Coolify moved this endpoint off GET.
          response=$(curl --fail-with-body -sS --retry 3 --retry-all-errors \
            -X POST \
            "${COOLIFY_BASE}/api/v1/deploy?uuid=${APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}")
          echo "${response}"
          deployment_uuid=$(echo "${response}" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "${deployment_uuid}" ]; then
            echo "::error::Coolify did not return a deployment_uuid"; exit 1
          fi
          echo "deployment_uuid=${deployment_uuid}" >> "$GITHUB_OUTPUT"

      - name: Wait for Coolify deployment to finish
        id: wait
        if: steps.guard.outputs.skip == 'false'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          # Poll every 10s, up to 10 minutes.
          for i in $(seq 1 60); do
            status=$(curl -sS --retry 3 --retry-all-errors \
              "${COOLIFY_BASE}/api/v1/deployments/${DEPLOYMENT_UUID}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" | jq -r '.status // "unknown"')
            echo "[${i}/60] deployment ${DEPLOYMENT_UUID}: ${status}"
            case "${status}" in
              finished) exit 0 ;;
              cancelled*) echo "cancelled=true" >> "$GITHUB_OUTPUT"; echo "::error::Coolify deployment cancelled"; exit 1 ;;
              failed|error) echo "::error::Coolify deployment ended as '${status}'"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Coolify deployment did not finish within 10 minutes"
          exit 1

      - name: Verify production readiness and exact deployed commit
        if: steps.guard.outputs.skip == 'false'
        env:
          EXPECTED_SHA: ${{ steps.guard.outputs.sha }}
        run: python3 scripts/ops/telegram-ops.py verify

      - name: Notify deployment outcome
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          RESULT: ${{ steps.wait.outputs.cancelled == 'true' && 'cancelled' || job.status }}
        run: |
          case "$RESULT" in
            success) export OPS_EVENT=deploy-succeeded ;;
            cancelled) export OPS_EVENT=build-deploy-cancelled ;;
            *) export OPS_EVENT=build-deploy-failed ;;
          esac
          python3 scripts/ops/telegram-ops.py notify

  notify-ci-failure:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Notify CI gate failure
        continue-on-error: true
        env:
          OPS_TELEGRAM_ENABLED: ${{ vars.OPS_TELEGRAM_ENABLED }}
          OPS_ENVIRONMENT: production
          XPOT_TELEGRAM_BOT_TOKEN: ${{ secrets.XPOT_TELEGRAM_BOT_TOKEN }}
          XPOT_TELEGRAM_CHAT_ID: ${{ secrets.XPOT_TELEGRAM_CHAT_ID }}
          OPS_EVENT: ${{ github.event.workflow_run.conclusion == 'cancelled' && 'build-deploy-cancelled' || 'ci-failed' }}
          OPS_DETAIL: Validation failed; production publication did not start. Check the failed jobs in this run.
          OPS_SHA: ${{ github.event.workflow_run.head_sha }}
          OPS_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: python3 scripts/ops/telegram-ops.py notify
