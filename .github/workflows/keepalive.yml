name: Supabase keep-alive

# Prevents the (free-tier) Supabase project from pausing after ~7 days of
# inactivity by pinging the REST API on a schedule. Uses the PUBLIC anon key
# (no DB password in CI). Scheduled workflows run only from the default branch.
#
# Requires repo secret: SUPABASE_ANON_KEY (the publishable/anon key — low risk,
# it is already shipped to browsers).

on:
  schedule:
    - cron: "0 */12 * * *" # every 12h — plenty of margin vs the ~7-day window
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: "https://swqxxeivetzakglaphil.supabase.co"
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set"
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "apikey: $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/sales_app_settings?select=id&limit=1")
          echo "REST ping -> HTTP $code"
          # Any HTTP response means PostgREST + the DB handled the request, which
          # counts as activity. Fail only on network errors / 5xx.
          case "$code" in
            2*|4*) echo "project is awake"; exit 0 ;;
            *) echo "::error::unexpected status $code"; exit 1 ;;
          esac
