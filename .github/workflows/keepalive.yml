name: Supabase keep-alive

# Prevents the (free-tier) Supabase project from pausing after ~7 days of
# inactivity by running a trivial query on a schedule. Scheduled workflows run
# only from the default branch (main). Requires the repo secret
# KEEPALIVE_DATABASE_URL — the Postgres connection string (same value as
# POSTGRES_URL in .env).

on:
  schedule:
    - cron: "0 */12 * * *" # every 12h — lots of margin vs the ~7-day pause window
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run keep-alive query
        env:
          DATABASE_URL: ${{ secrets.KEEPALIVE_DATABASE_URL }}
          PGSSLMODE: require
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::KEEPALIVE_DATABASE_URL secret is not set"
            exit 1
          fi
          command -v psql >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select 1 as keep_alive, now();"
