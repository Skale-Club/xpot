<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0" />
    <title>Xpot</title>
    <meta name="description" content="Xpot | mobile-first field sales companion." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#09090b" />
    <meta name="application-name" content="Xpot" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Xpot" />
    <!-- Favicon served dynamically from the admin-uploaded icon (see /api/branding/*). -->
    <link rel="icon" href="/api/branding/favicon" />
    <link rel="apple-touch-icon" href="/api/branding/apple-touch-icon.png" />
    <link rel="manifest" href="/api/branding/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Xpot" />
    <meta property="og:description" content="Xpot | mobile-first field sales companion." />
    <meta property="og:image" content="/api/branding/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/api/branding/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <div id="initial-loader" style="position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background-color: #0f1014;">
      <div class="loader-dots">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
      </div>
    </div>
    <style>
      .loader-dots { display: flex; align-items: center; gap: 10px; }
      .loader-dot {
        width: 14px; height: 14px; border-radius: 50%;
        background-color: #406EF1;
        animation: dotBounce 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .loader-dot:nth-child(1) { animation-delay: 0s; }
      .loader-dot:nth-child(2) { animation-delay: 0.16s; }
      .loader-dot:nth-child(3) { animation-delay: 0.32s; }
      .loader-fade-out { opacity: 0 !important; transition: opacity 0.15s ease-out; }
      @keyframes dotBounce {
        0%, 80%, 100% { transform: scale(0.6) translateY(0); opacity: 0.4; }
        40%           { transform: scale(1)   translateY(-8px); opacity: 1; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
